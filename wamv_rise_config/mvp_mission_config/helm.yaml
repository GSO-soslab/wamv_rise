finite_state_machine:
  start:
    initial: true
    control_mode: idle
    transitions: [survey, kill, teleop]

  kill:
    control_mode: idle
    transitions: [start]
    
  survey:
    control_mode: flight
    transitions: [start, kill]

  teleop:
    control_mode: flight
    transitions: [start, kill]

behaviors:
  bhv_teleop:
    plugin: helm/Teleoperation
    priority:
      teleop: 1

  bhv_path_following:
    plugin: helm/PathFollowing
    priority:
      survey: 1