finite_state_machine:
  start:
    initial: true
    control_mode: idle
    transitions: [survey, kill, teleop, manual_teleop]
    # max_duration: .inf
    # exit_state: start
    
  kill:
    control_mode: idle
    transitions: [start]
    # max_duration: 5
    # exit_state: start

  survey:
    control_mode: flight
    transitions: [start, kill]
    # max_duration: 100
    # exit_state: start

  teleop:
    control_mode: flight
    transitions: [start, kill]
    # max_duration: 100
    # exit_state: start

  manual_teleop:
    control_mode: idle
    transitions: [start, survey, teleop, kill] 

behaviors:
  bhv_teleop:
    plugin: helm/Teleoperation
    priority:
      teleop: 1

  bhv_path_following:
    plugin: helm/PathFollowing
    priority:
      survey: 1