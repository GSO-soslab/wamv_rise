Serial:
  port: /dev/torqeedo_port
  baud: 19200
  parity: 0
  databits: 8
  stopbits: 1
  timeout: 1000

Motor:
  # note: Wiring Pi pin number
  pin: 23

System:
  safety_timeout: 2
  # Brief: default value for field (e.g., salt pond) is 0.4
  # Brief: default value for windy day (e.g., beach pond) is 0.5
  # Brief: default value for test is 0.1
  scale: 0.5

ROS:
  frame_id: torqeedo_port