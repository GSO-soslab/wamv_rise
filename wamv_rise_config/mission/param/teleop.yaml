global_link: wamv_rise/world_ned
local_link: wamv_rise/cg_link

########################################
############## Limitation ##############
########################################
# unit: radians 
max_z: 10
max_roll: 1.5707963 
max_pitch: 1.5707963
max_surge: 1.5
max_sway: 1.5

####tele-op, ang in degrees####
##left up/down controls surge
##left stick left/right controls sway
##X and B controls yaw
##Y and A controls pitch
##RB and RT controls depth
## LB has to be pressed for any command update
##LT resets desired states
tele_s_surge: 1
tele_s_sway: 1
tele_d_yaw: 10.0 
tele_d_pitch: 10.0
tele_d_depth: 1.0

no_joy_timeout: 600
