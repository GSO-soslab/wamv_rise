helm_configuration:
  frequency: 10.0
  global_link: world_ned
  local_link: cg_link
  
finite_state_machine:
  - name: start
    mode: idle
    initial: true
    transitions:
      - survey_3d
      - kill
      - teleop

  - name: survey_3d
    mode: flight
    transitions:
      - start
      - kill

  - name: kill
    mode: idle
    transition:
      - start

  - name: teleop
    mode: flight
    transitions:
      - start
      - kill

behaviors:
  - name: path_3d
    plugin: helm::PathFollowing3D
    states:
      - { name: survey_3d, priority: 1 }

  - name: teleop
    plugin: helm::Teleoperation
    states:
      - { name: teleop, priority: 1 }
