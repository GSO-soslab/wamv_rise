# /wamv_rise/airmar_ws:
/**:
  ros__parameters:
    # The usb device for unicore gps
    # device: /dev/ttyUSB5
    device: /dev/airmar

    baudrate: 4800
    
    frame_id: wamv_rise/airmar_ws

    # True: send NMEA string to GPSD, use '127.0.0.1' by default
    use_gpsd_udp: True
    virtual_port: 5005

    # True: use the gps timestamp, False: use IO time when gps message arrived
    use_gnss_time: False