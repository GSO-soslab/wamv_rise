bhv_path_following:

  default_bhv_world_link: world_ned
  default_bhv_child_link: cg_link

  state_done: start
  state_fail: kill
  acceptance_radius: 3.0
  lookahead_distance: 3.0
  overshoot_timeout: 600.0
  # surge_velocity: 1.0
  
  sigma: 0.00 #integral gain
  beta_gain: 0.0 #sideslip compensation gain

  pitch_gain: 0.0
  pitch_assist_band: 0.5
  max_pitch: 0.35

  lookahead_adaptive_flag: true
  lookahead_max: 8.0
  lookahead_min: 2.0
  lookahead_gamma: 1.0
  turning_surge_velocity: 0.3
  turning_angle_sector: 1.0

  waypoint_x: [30.0, 0.0]
  waypoint_y: [0.0, 20.0]
  waypoint_z: [0.0, 0.0]
  waypoint_u: [0.5, 0.8]

  waypoint_file_package: wamv_rise_bringup
  waypoint_path: config/go_to_list/

  # TODO: ?
  # update_topic: update_waypoints
  # append_topic: append_waypoints

bhv_teleop:
  default_bhv_world_link: world_ned
  default_bhv_child_link: cg_link
  ####tele-op, ang in degrees####
  ##left up/down controls surge
  ##X and B controls yaw
  ##Y and A controls pitch
  ##RB and RT controls depth
  ## LB has to be pressed 
  ##LT resets desired states to zero for all.
  tele_s_surge: 1.5
  tele_s_sway: 1.0
  tele_d_yaw: 10.0 
  tele_d_pitch: 10.0
  tele_d_depth: 1.0
  no_joy_timeout: 600.0
