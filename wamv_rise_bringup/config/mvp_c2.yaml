###########################################################
## vehicle side stuff
###########################################################
/wamv_rise/mvp_c2_reporter:
  ros__parameters:
    dccl_tx_interval: 1.0
    helm_state_list: ['start', 'kill', 'teleop', 'survey', 'manual_teleop'] #this has to match the helm
    launch_packages: ['wamv_rise_bringup', 'wamv_rise_bringup', 'wamv_rise_bringup', 'wamv_rise_bringup',  'wamv_rise_bringup']
    launch_files: ['bringup_pi_utilities', 'bringup_pi_thruster', bringup_pi_payload, 'bringup_pi_localization', 'bringup_pi_mvp']
    gpio_devices: [underwater_payload, jetson_board, norbit]  # this needs to match the gpio manager yaml
    local_id: 12
    remote_id: 11

/wamv_rise/reporter_c2_serial_comm:
  ros__parameters:
    # port: /dev/vehicle_rf
    port: /dev/ttyUSB4
    baudrate: 57600

